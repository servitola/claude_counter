## Periphery — dead-code analyzer.
## Run via `make dead-code`; CI uses --strict so any unused decl fails.
## SPM autodetection: invoked with project-root pointing at `App/`.

retain_objc_accessible: true
retain_objc_annotated: true
retain_public: false
retain_assign_only_property_types: []
retain_unused_protocol_func_params: false

## Tests reach internals via @testable import — keep them.
retain_files:
  - Tests/**/*.swift
