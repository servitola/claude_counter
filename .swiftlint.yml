## SwiftLint — maximum strictness for Claude Counter.
## Treats warnings as errors via `--strict` in `make lint`.

included:
  - App/Sources
  - App/Tests

excluded:
  - App/.build
  - App/.swiftpm

reporter: emoji

## Default rules we want OFF (too noisy or contradict our style).
disabled_rules:
  - todo                            # we deliberately don't track TODOs in code
  - trailing_comma                  # SwiftFormat owns this
  - opening_brace                   # SwiftFormat owns this
  - multiline_arguments             # too aggressive for AppKit selectors
  - sorted_imports                  # SwiftFormat owns import grouping
  - attributes                      # conflicts with @Test/@objc compact form
  - conditional_returns_on_newline  # style noise around guards

## Heavy opt-ins — what makes lint actually catch bugs.
opt_in_rules:
  - anonymous_argument_in_multiline_closure
  - array_init
  - balanced_xctest_lifecycle
  # `redundant_self_in_closure` was renamed to `redundant_self` upstream;
  # keep only the new name.
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - convenience_type
  - direct_return
  - discarded_notification_center_observer
  - discouraged_assert
  - discouraged_object_literal
  - discouraged_optional_boolean
  - discouraged_optional_collection
  - empty_collection_literal
  - empty_count
  - empty_string
  - empty_xctest_method
  - enum_case_associated_values_count
  - explicit_init
  - fallthrough
  - fatal_error_message
  - file_name_no_space
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - identical_operands
  - implicit_return
  - implicitly_unwrapped_optional
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - legacy_objc_type
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - missing_docs
  - modifier_order
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - nimble_operator
  - nslocalizedstring_key
  - nslocalizedstring_require_bundle
  - operator_usage_whitespace
  - overridden_super_call
  - override_in_extension
  - pattern_matching_keywords
  - prefer_self_in_static_references
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - prefixed_toplevel_constant
  - private_action
  - private_outlet
  - private_subject
  - prohibited_super_call
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - return_value_from_void_function
  - shorthand_optional_binding
  - single_test_class
  - sorted_first_last
  - static_operator
  - strict_fileprivate
  - test_case_accessibility
  - toggle_bool
  - trailing_closure
  - unavailable_function
  - unhandled_throwing_task
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - untyped_error_in_catch
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_between_cases
  - vertical_whitespace_closing_braces
  - weak_delegate
  - xct_specific_matcher
  - yoda_condition

analyzer_rules:
  - capture_variable
  - typesafe_array_init
  - unused_declaration
  - unused_import

## Per-rule tuning.
line_length:
  warning: 100
  error: 120
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 300
  error: 500

function_body_length:
  warning: 40
  error: 80

type_body_length:
  warning: 200
  error: 350

cyclomatic_complexity:
  warning: 10
  error: 15

nesting:
  type_level: 2
  function_level: 3

identifier_name:
  min_length: 2
  max_length:
    warning: 50
    error: 60
  excluded:
    - id
    - js
    - to
    - h
    - m
    - hh
    - mm
    - pi
    - rm
    - it
    - wv
    - pct
    - mins
    - lhs
    - rhs

trailing_whitespace:
  ignores_empty_lines: true

force_try:
  severity: error
force_cast:
  severity: error

custom_rules:
  no_print:
    name: "No print()"
    regex: '(?<!\w)print\('
    message: "Use os.Logger instead of print()."
    severity: error
  no_nslog:
    name: "No NSLog"
    regex: '(?<!\w)NSLog\('
    message: "Use AppLog (os.Logger) instead of NSLog."
    severity: error
    excluded:
      - ".*Tests/.*"
