name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: build · test · lint · format · dead-code
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer

    steps:
      - uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Cache SwiftPM build artifacts
        uses: actions/cache@v4
        with:
          path: |
            App/.build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('App/Package.swift', 'App/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Install toolchain
        run: |
          brew install swiftlint swiftformat periphery
          swiftlint --version
          swiftformat --version
          periphery version

      - name: SwiftFormat (lint mode)
        run: make format-check

      - name: SwiftLint (strict)
        run: make lint

      - name: swift build
        run: make build

      - name: swift test
        run: make test

      - name: Periphery (dead-code, strict)
        run: make dead-code
