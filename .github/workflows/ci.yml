name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: build · test · lint · format · dead-code
    # Liquid Glass APIs need the macOS 26 SDK and Package.swift needs Swift 6.2;
    # the macos-15 image tops out at Swift 6.0.
    runs-on: macos-26
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - name: Show Swift version
        run: swift --version

      - name: Install toolchain
        run: |
          brew install swiftlint swiftformat periphery
          swiftlint --version
          swiftformat --version
          periphery version

      - name: SwiftFormat (lint mode)
        run: make format-check

      - name: SwiftLint (strict)
        run: make lint

      - name: swift build
        run: make build

      - name: swift test
        run: make test

      - name: Periphery (dead-code, strict)
        run: make dead-code
