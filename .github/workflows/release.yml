name: Release

# Cut a release by pushing a semver tag:
#   git tag v1.2.0 && git push origin v1.2.0
# This builds the release .app, zips it, and publishes a GitHub Release
# with auto-generated notes and the zip attached.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed to create the Release and upload assets

jobs:
  release:
    name: build · package · publish
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so `git describe` / commit count work

      - name: Resolve version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

      - name: Build app bundle
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/build-app.sh

      - name: Package .app into a zip
        run: |
          ZIP="ClaudeCounter-${{ steps.version.outputs.version }}.zip"
          ditto -c -k --keepParent App/.build/ClaudeCounter.app "$ZIP"
          shasum -a 256 "$ZIP" | tee "$ZIP.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## ClaudeCounter ${{ steps.version.outputs.version }}

            ### Install
            1. Download `ClaudeCounter-${{ steps.version.outputs.version }}.zip` below and unzip.
            2. Move `ClaudeCounter.app` to `/Applications`.
            3. The build is signed locally (not notarized), so macOS Gatekeeper
               will block it on first launch. Clear the quarantine flag:
               ```sh
               xattr -dr com.apple.quarantine /Applications/ClaudeCounter.app
               ```
               (or right-click the app → **Open** the first time).
          files: |
            ClaudeCounter-*.zip
            ClaudeCounter-*.zip.sha256
